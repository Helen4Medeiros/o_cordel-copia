{% for c in cordeis_aleatorios %}
    {% if loop.index <= 5 %}
        <div class="card-cordel-{{ loop.cycle('lilas', 'laranja', 'azul', 'verde') }}">
            <a href="{{ url_for('cordel', id=c.id) }}">
                <div class="card-border">
                    {{ c.titulo }}
                </div>
            </a>
        </div>
    {% endif %}
{% endfor %}
